name: Repository safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and local paths
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_LINUX_X64_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan Git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --no-banner --no-color --redact --verbose .

      - name: Scan repository files for local paths
        run: python3 scripts/check_repository_safety.py --all-files

      - name: Check Codex and Claude marketplace parity
        run: |
          python3 scripts/check_marketplace_parity.py
          python3 -m unittest discover -s tests -v
